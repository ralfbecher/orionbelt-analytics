[project]
name = "orionbelt-analytics"
version = "1.7.2"
description = "OrionBelt Analytics - the Ontology-based MCP server for your Text-2-SQL convenience"
authors = [{name = "Ralf Becher, RALFORION d.o.o.", email = "info@ralforion.com"}]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["mcp", "database", "ontology", "rdf", "schema-analysis", "postgresql", "snowflake", "clickhouse", "bigquery", "duckdb", "databricks", "mysql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core MCP Framework with Apps support
    "fastmcp[apps]>=3.3.1,<3.5",
    # Database connectivity - latest versions
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
    "snowflake-sqlalchemy>=1.8.2",
    "snowflake-connector-python>=4.2.0",
    # ClickHouse connectivity
    "clickhouse-sqlalchemy>=0.3.2",
    "clickhouse-driver>=0.2.10",
    # BigQuery connectivity
    "sqlalchemy-bigquery>=1.11.0",
    # DuckDB connectivity
    "duckdb>=1.1.0",
    "duckdb-engine>=0.13.0",
    # Databricks connectivity
    "databricks-sql-connector>=3.5.0",
    # MySQL connectivity
    "pymysql>=1.1.0",
    # Security dependencies
    "cryptography>=46.0.5",
    # Configuration and validation
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    # Semantic web libraries
    "rdflib>=7.5.0",
    "owlrl>=7.1.4",
    # SHACL conformance checking of generated/loaded ontologies (Phase 4)
    "pyshacl>=0.26.0",
    # Visualization libraries
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
    "pandas>=2.2.3",
    "pillow>=12.1.1",
    # Network and async
    "aiohttp>=3.13.3",
    # SQL parsing for OBQC validation
    "sqlglot>=28.10.1",
    # GraphRAG dependencies
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "numpy>=1.24.0",
    # ChromaDB for efficient vector storage (replaces JSON files)
    "chromadb>=0.4.0",
    # Oxigraph RDF store for SPARQL endpoint
    "pyoxigraph>=0.5,<0.6",
    # NLP word frequency for cryptic name detection
    "wordfreq>=3.1.1",
]

[project.urls]
Homepage = "https://github.com/ralforion/orionbelt-analytics"
Repository = "https://github.com/ralforion/orionbelt-analytics"
Documentation = "https://github.com/ralforion/orionbelt-analytics#readme"
Issues = "https://github.com/ralforion/orionbelt-analytics/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ship the OBA ontology vocabulary + SHACL shapes so in-process SHACL
# validation (Phase 4) works from an installed wheel, not only from source.
[tool.hatch.build.targets.wheel.force-include]
"ontology/oba.ttl" = "ontology/oba.ttl"
"ontology/oba-shacl.ttl" = "ontology/oba-shacl.ttl"

[tool.hatch.version]
path = "src/__init__.py"

[dependency-groups]
dev = [
    # Testing framework
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    # Code formatting and linting
    "black>=23.12.0,<24.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    # Security tools - NEW
    "bandit>=1.7.5,<2.0.0",
    "safety>=3.0.0,<4.0.0",
    # Git hooks and automation
    "pre-commit>=3.6.0,<5.0.0",
    # Performance testing
    "locust>=2.20.0,<3.0.0",
    "ruff>=0.15.10",
    "vulture>=2.16",
]

# Tool configurations
[tool.ruff]
line-length = 88
# target-version is inferred from requires-python (>=3.13); left implicit so it
# tracks that single source of truth.

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's built-in defaults, which are
# not stable across releases: 0.16.0 widened the default set from 118 rules to
# 826 while dropping E401/E402/E7xx, turning routine ruff bumps into thousands
# of unrelated failures. Everything enabled here is enabled on purpose.
select = [
    "E4",     # import formatting
    "E7",     # statement-level errors
    "E9",     # syntax / IO errors
    "F",      # pyflakes
    "UP",     # pyupgrade -- PEP 585/604 typing, modern idioms
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie -- unnecessary code
    "PERF",   # perflint
    "EXE",    # shebang correctness
    "PYI",    # stub/typing correctness
    "RUF",    # ruff-specific
    "ASYNC",  # blocking calls inside async functions
    "S110",   # silently swallowed exceptions
    "DTZ",    # naive datetimes -- timestamps are persisted and compared
    "G201",   # logger.error(exc_info=True) -> logger.exception
]

# BLE001 (blind `except Exception`) is intentionally NOT selected. All 167
# sites were audited, not waved through: 153 log, 23 re-raise, and 23 fold the
# message into the returned error payload. That breadth is required at the MCP
# tool boundary -- a handler must convert failures into an error response
# rather than leak an arbitrary exception into the protocol layer -- so
# enabling the rule would mean 167 `noqa` comments and no added safety.
#
# The 4 handlers that genuinely discarded their exception were fixed. The
# invariant that actually matters ("a broad handler must not throw the error
# away") is enforced by tests/test_no_silent_exceptions.py, which walks the AST
# and fails on any regression -- a stricter and more precise guarantee than the
# lint rule provides.

# Tests legitimately hold mutable class-level fixtures; that is noise there
# rather than signal.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.black]
line-length = 88
# Highest syntax level the pinned black (>=23.12,<24) understands. The runtime
# target is still Python 3.13 (see requires-python); this only bounds the syntax
# black may emit. Bump to py313 when black is upgraded to >=24.10.
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Third-party libraries without type stubs or a py.typed marker. We type-check
# our own code strictly but cannot annotate these, so silence their import noise.
[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "sklearn.*",
    "sentence_transformers.*",
    "community.*",
    "pandas.*",
    "networkx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

# Security tools configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used test

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# Safety configuration for vulnerability scanning
[tool.safety]
# Ignore specific vulnerabilities if needed (use with caution)
ignore = []
