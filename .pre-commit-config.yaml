# Pre-commit hooks for code quality and security
repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.13

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Code linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]

  # Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-r", "src/"]
        exclude: tests/

  # Type checking — targets Python 3.13 to match pyproject (requires-python >=3.13).
  # --ignore-missing-imports is justified: several runtime deps ship no type stubs
  # (fastmcp, pyoxigraph, chromadb, snowflake/databricks/dremio connectors).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --python-version=3.13]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
        exclude: tests/

  # Security vulnerability scanning
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.25.0
    hooks:
      - id: ggshield
        language: python
        stages: [commit]

  # Third-party attribution: keep THIRD_PARTY_NOTICES.md in step with the
  # locked production tree. Scoped to the files that can change the dependency
  # set, so it does not run (and does not need the venv) on an ordinary commit.
  - repo: local
    hooks:
      - id: third-party-notices
        name: third-party notices
        entry: uv run python scripts/gen-third-party-notices.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|scripts/gen-third-party-notices\.py)$

  # Dependency vulnerability scanning
  - repo: local
    hooks:
      - id: safety
        name: safety
        entry: safety
        language: system
        args: ["check", "--json"]
        files: requirements.*\.txt$
