name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gates: these pass and must stay green on every PR.
  # Matrix covers the full requires-python range (>=3.13): 3.13 is what most
  # installs from PyPI get, 3.14 is what the Docker image ships.
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # server.py is the entry point and lives at the repo root -- keep it in
      # every lint/format gate, otherwise it silently drifts out of adoption
      # whenever a rule set changes.
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ server.py

      - name: Format check (black)
        run: uv run black --check src/ tests/ server.py

      - name: Import order (isort)
        run: uv run isort --check-only src/ tests/ server.py

      - name: Tests
        run: uv run pytest

  # Blocking gate: THIRD_PARTY_NOTICES.md matches the locked production tree.
  #
  # The Docker image bundles every production dependency, so its attribution
  # obligations move whenever the dependency set does -- and in this repo that
  # is mostly Dependabot, not a human. The generator omits versions and derives
  # every row from the package name, so a routine bump produces no diff; this
  # job only goes red when a package enters or leaves the tree, changes
  # licence, or arrives under copyleft terms nobody has read yet.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Third-party notices up to date
        run: uv run python scripts/gen-third-party-notices.py --check

  # Blocking gate: src/ type-checks clean under strict mypy. Keep it green.
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Type check (mypy)
        run: uv run mypy src
