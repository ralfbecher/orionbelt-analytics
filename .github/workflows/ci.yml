name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: no job in this workflow writes to the repository, so
# the token it gets cannot either. Anything that ever needs a scope gets it on
# that single job, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gates: these pass and must stay green on every PR.
  # Matrix covers the full requires-python range (>=3.13): 3.13 is what most
  # installs from PyPI get, 3.14 is what the Docker image ships.
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # server.py is the entry point and lives at the repo root -- keep it in
      # every lint/format gate, otherwise it silently drifts out of adoption
      # whenever a rule set changes.
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ server.py

      - name: Format check (black)
        run: uv run black --check src/ tests/ server.py

      - name: Import order (isort)
        run: uv run isort --check-only src/ tests/ server.py

      - name: Tests
        run: uv run pytest

  # Blocking gate: THIRD_PARTY_NOTICES.md matches the locked production tree.
  #
  # The Docker image bundles every production dependency, so its attribution
  # obligations move whenever the dependency set does -- and in this repo that
  # is mostly Dependabot, not a human. The generator omits versions and derives
  # every row from the package name, so a routine bump produces no diff; this
  # job only goes red when a package enters or leaves the tree, changes
  # licence, or arrives under copyleft terms nobody has read yet.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Third-party notices up to date
        run: uv run python scripts/gen-third-party-notices.py --check

  # Blocking gate: src/ type-checks clean under strict mypy. Keep it green.
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Type check (mypy)
        run: uv run mypy src

  # Blocking gate: no known advisory in the tree that actually ships.
  #
  # Dependabot alerts cover the whole lockfile including the dev group, which
  # makes them wider than this gate on purpose -- a dev-only advisory should
  # not stop a release. This job is the narrower question: is a user who
  # installs the wheel exposed? The accepted-advisory list lives in the script
  # beside the reason each one is unreachable, so it stays reviewable in diff.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Audit production dependencies (pip-audit)
        run: ./scripts/audit-prod-deps.sh

  # Blocking gate: every `uses:` in every workflow is pinned to an immutable
  # commit SHA whose version comment names the release it was really cut from.
  #
  # Pinning alone fixes which code runs but makes every reference unreadable,
  # and nothing otherwise keeps a hash and the `# vX.Y.Z` beside it in
  # agreement. A pull request could swap in a commit from a fork -- reachable
  # under the real repository's URL, because forks share object storage --
  # leave the comment untouched, and look exactly like a Dependabot bump. This
  # job resolves each tag upstream and is the only thing that tells them apart.
  pins:
    name: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh
